spring:
  application:
    name: service-provider
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:service_provider_db}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

application:
  security:
    jwt:
      # Base64-encoded 256-bit secret. Override via JWT_SECRET_KEY env var in production.
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      # Token validity in milliseconds (default: 24 hours)
      expiration: ${JWT_EXPIRATION:86400000}
  encryption:
    # AES-256 key — padded/truncated to 32 bytes at runtime. Override in production.
    secret-key: ${ENCRYPTION_SECRET_KEY:MyS3cr3tEncryptionKey!2024PROD}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.serviceprovider: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
